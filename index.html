<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로켓단의 뒷세계 · Team Rocket UnderWorld</title>
<meta name="description" content="Team Rocket UnderWorld · 코블몬 서버 로켓단의 의뢰, PVP 대회, 경매, 단원 전용 거래소">
<meta property="og:title" content="로켓단의 뒷세계 · Team Rocket UnderWorld">
<meta property="og:description" content="코블몬 서버 로켓단의 의뢰 · PVP 대회 · 경매 게시판">
<meta property="og:image" content="/assets/og.jpg">
<meta name="theme-color" content="#0b0b0e">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#0b0b0e; --bg2:#101015; --panel:#15151b; --panel2:#1c1c24; --line:#2a2a34; --line2:#383845;
  --text:#ecebf1; --muted:#8f8d9c; --dim:#5f5d6b;
  --red:#e0282f; --red2:#ff4a50; --redbg:rgba(224,40,47,.12);
  --gold:#f2c14e; --goldbg:rgba(242,193,78,.12);
  --ok:#3ecf8e; --okbg:rgba(62,207,142,.12);
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --display:'Black Han Sans','Pretendard Variable',sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 'Pretendard Variable',Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
/* 배경: 네온 뒷골목 (밤 도시 실루엣, 붉은 네온 안개, 빗줄기) */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx>div{position:absolute;inset:0}
/* C. 네온 뒷골목: 밤 도시 실루엣, 붉은 네온 안개, 빗줄기 */
body{background:linear-gradient(180deg, #060609 0%, #0b0910 50%, #1b0a10 100%)}
.bgfx .glow{background:
  radial-gradient(45% 30% at 16% 74%, rgba(255,40,90,.36), transparent 70%),
  radial-gradient(42% 28% at 84% 70%, rgba(224,40,47,.40), transparent 70%),
  radial-gradient(60% 22% at 50% 82%, rgba(255,110,60,.16), transparent 70%),
  linear-gradient(transparent 55%, rgba(120,20,40,.18));
  animation:bgFog 11s ease-in-out infinite alternate}
.bgfx .far{top:auto;bottom:0;height:min(48vh,420px);background:url(assets/bg/city-far.svg) repeat-x 0 100%/auto 100%;opacity:.9}
.bgfx .near{top:auto;bottom:0;height:min(34vh,300px);background:url(assets/bg/city-near.svg) repeat-x 140px 100%/auto 100%}
.bgfx .rain{inset:-120px 0 0 0;
  background:repeating-linear-gradient(104deg, transparent 0 22px, rgba(200,210,255,.06) 22px 23px, transparent 23px 47px, rgba(200,210,255,.035) 47px 48px);
  -webkit-mask-image:linear-gradient(transparent, #000 25%, #000 75%, transparent);mask-image:linear-gradient(transparent, #000 25%, #000 75%, transparent);
  animation:bgRain .9s linear infinite}
.bgfx .vig{background:radial-gradient(130% 90% at 50% 40%, transparent 55%, rgba(0,0,0,.7))}
@keyframes bgFog{from{transform:translateX(-3%) scale(1)}to{transform:translateX(3%) scale(1.06)}}
@keyframes bgRain{from{transform:translate(0,0)}to{transform:translate(-26px,120px)}}
@media (prefers-reduced-motion: reduce){.bgfx div{animation:none!important}}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(11,11,14,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand img{width:44px;height:44px;flex:none;object-fit:contain;filter:drop-shadow(0 0 6px rgba(224,40,47,.35))}
.brand b{font:400 24px/1 var(--display);letter-spacing:.02em}
.brand small{display:block;font:500 10px/1 var(--mono);color:var(--muted);letter-spacing:.18em;margin-top:4px}
.userbox{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.who{display:flex;align-items:center;gap:8px;min-width:0;text-decoration:none}
.who .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.av{width:30px;height:30px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.hazard{height:4px;background:repeating-linear-gradient(-45deg,var(--red) 0 10px,#160708 10px 20px)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:10px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text);background:var(--panel)}
.tab.on{color:var(--text);background:var(--panel2);border-color:var(--line2)}
.tab.rk{color:var(--red2)}
.tab.rk.on{background:var(--redbg);border-color:rgba(224,40,47,.45)}
.tab.ad{color:var(--gold)}
.tab.ad.on{background:var(--goldbg);border-color:rgba(242,193,78,.4)}

/* ---------- common ---------- */
main{padding:8px 0 80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red2)}
.btn.ghost{background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.danger{color:var(--red2);border-color:rgba(224,40,47,.4);background:transparent}
.btn.danger:hover{background:var(--redbg)}
.btn.discord{background:#5865f2;border-color:#5865f2;color:#fff;height:46px;padding:0 22px;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:99px;font:700 11px/1 var(--mono);letter-spacing:.04em;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip.open{color:var(--ok);background:var(--okbg);border-color:rgba(62,207,142,.35)}
.chip.red{color:var(--red2);background:var(--redbg);border-color:rgba(224,40,47,.4)}
.chip.gold{color:var(--gold);background:var(--goldbg);border-color:rgba(242,193,78,.35)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r)}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:18px 0 18px}
.head .code{font:700 11px/1 var(--mono);letter-spacing:.22em;color:var(--red2)}
.head h1{font:400 32px/1.15 var(--display);margin:8px 0 4px;letter-spacing:.01em}
.head p{margin:0;color:var(--muted)}
h2.sec{font:700 12px/1 var(--mono);letter-spacing:.2em;color:var(--muted);margin:34px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
.card.closed{opacity:.62}
.card.closed::before{background:var(--dim)}
.card .tag{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .fid{font:700 11px/1 var(--mono);letter-spacing:.14em;color:var(--muted)}
.card h3{margin:0;font-size:17px;line-height:1.35;word-break:break-word}
.card .body{margin:0;color:#c9c7d3;white-space:pre-wrap;word-break:break-word;font-size:14px}
.kvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.kv{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
.kv span{display:block;font:500 10.5px/1.3 var(--mono);color:var(--muted);letter-spacing:.06em}
.kv b{display:block;font-weight:600;font-size:13.5px;word-break:break-word}
.by{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);min-width:0}
.by .av{width:22px;height:22px;font-size:10px}
.by strong{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
details.ent{border-top:1px solid var(--line);padding-top:8px}
details.ent summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none}
details.ent summary::-webkit-details-marker{display:none}
details.ent summary::before{content:"▸ ";color:var(--red2)}
details.ent[open] summary::before{content:"▾ "}
.ent ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.ent li{font-size:13px;background:var(--bg2);border-radius:6px;padding:6px 9px}
.ent li b{font-weight:600}
.ent li span{color:var(--muted)}

/* ---------- hero ---------- */
.hero{margin-top:22px;display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.hero .main{position:relative;background:linear-gradient(135deg,#1a0b0d 0%,var(--panel) 55%);border:1px solid rgba(224,40,47,.35);border-radius:14px;padding:28px;overflow:hidden}
.hero .main::after{content:"R";position:absolute;right:-8px;bottom:-26px;font:400 120px/1 var(--display);color:rgba(224,40,47,.07);pointer-events:none}
.hero .code{font:700 11px/1 var(--mono);letter-spacing:.24em;color:var(--red2)}
.hero h1{font:400 40px/1.1 var(--display);margin:12px 0 10px}
.hero p{margin:0;color:#c9c7d3;max-width:44ch}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
.stat .row{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.stat .row span{color:var(--muted)}
.feed{display:flex;flex-direction:column;gap:8px}
.feed a{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:9px;text-decoration:none}
.feed a:hover{border-color:var(--line2)}
.feed .t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .when{font:500 12px/1 var(--mono);color:var(--muted);flex:none}
.notice{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:9px;padding:14px 16px}
.notice h3{margin:0 0 4px;font-size:16px}
.notice p{margin:0;white-space:pre-wrap;color:#c9c7d3;font-size:14px}
.notice .meta{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:9px;background:var(--goldbg);border:1px solid rgba(242,193,78,.35);margin-top:14px;font-size:14px}

/* ---------- landing ---------- */
.landing{min-height:calc(100vh - 140px);display:grid;place-items:center;text-align:center;padding:40px 0}
.landing .emb img{width:min(260px,62vw);height:auto;display:block;margin:0 auto;filter:drop-shadow(0 8px 30px rgba(224,40,47,.35))}
.landing h1{font:400 40px/1.1 var(--display);margin:14px 0 8px;letter-spacing:.01em}
.credit{position:relative;z-index:1;text-align:center;width:fit-content;margin:64px auto 22px;padding:5px 14px;border-radius:99px;background:rgba(6,6,10,.78);border:1px solid rgba(255,255,255,.06);font:500 11px/1.4 var(--mono);color:var(--dim);letter-spacing:.06em}
.credit b{color:var(--muted);font-weight:600}
.landing p{color:var(--muted);margin:0 0 26px}
.landing .fine{font-size:13px;margin-top:18px}

/* ---------- sub tabs / table ---------- */
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--red);color:#fff}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}
.input,select.input,textarea.input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;outline:none}
.input:focus{border-color:var(--red)}
textarea.input{min-height:90px;resize:vertical}
.members{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.2fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 14px}
.mrow .id{display:flex;align-items:center;gap:10px;min-width:0}
.mrow .id div{min-width:0}
.mrow .id b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .id b .chip{margin-left:4px;vertical-align:1px}
.mrow .id small{color:var(--muted);font-size:12px}
.mrow .mc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.mrow .mc code{font-family:var(--mono);font-size:13px}
.mrow .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.mrow select{height:30px;padding:0 8px;border-radius:7px;background:var(--bg2);border:1px solid var(--line2)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.panel h3{margin:0 0 6px;font-size:16px}
.panel p{margin:0 0 12px;color:var(--muted);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:#c9c7d3}
.hint{font-size:12px;color:var(--muted)}
.hint b{color:#d9d7e2;font-weight:600}
.hint.lock{margin:0 0 12px;padding:8px 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:13px;color:#c9c7d3}
.field .hint{font-size:12px;color:var(--muted)}
.res{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.res .dir{font:700 11px/1 var(--mono);letter-spacing:.1em;padding:6px 8px;border-radius:6px;background:var(--redbg);color:var(--red2);text-align:center}
.res .dir.in{background:var(--okbg);color:var(--ok)}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.66);display:grid;place-items:center;padding:16px}
.sheet{width:100%;max-width:480px;max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px}
.sheet h3{margin:0 0 4px;font:400 22px/1.2 var(--display)}
.sheet .sub{margin:0 0 16px;color:var(--muted);font-size:14px}
.sheet .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.summary{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:14px;font-size:14px}
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100% - 32px))}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--ok);border-radius:9px;padding:11px 14px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:up .2s ease-out}
.toast.err{border-left-color:var(--red)}
.toast.warn{border-left-color:var(--gold)}
@keyframes up{from{transform:translateY(8px);opacity:0}}
.demo{background:repeating-linear-gradient(-45deg,rgba(242,193,78,.1) 0 12px,transparent 12px 24px),var(--bg2);border-bottom:1px solid rgba(242,193,78,.3);font-size:13px}
.demo .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.demo b{color:var(--gold)}
.demo .seg button{padding:4px 10px;font-size:12.5px}
.steps{list-style:none;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0;margin:26px 0 22px}
.steps li{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border:1px solid var(--line2);border-radius:99px;background:var(--panel);font-weight:600;font-size:14px;color:var(--muted)}
.steps li b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font:700 12px/1 var(--mono);color:var(--text)}
.steps li small{font-weight:400;font-size:12px;color:var(--dim)}
.steps li.done{color:var(--ok);border-color:rgba(62,207,142,.35)}
.steps li.done b{background:var(--ok);color:#06180f}
.steps li.cur{color:var(--text);border-color:var(--red)}
.steps li.cur b{background:var(--red)}
.gate{margin-top:22px;padding:28px;border-radius:14px;border:1px solid rgba(224,40,47,.5);text-align:center;
  background:radial-gradient(600px 220px at 50% 0%,rgba(224,40,47,.16),transparent 70%),var(--panel)}
.gate .steps{margin:0 0 18px}
.gate h2{font:400 28px/1.2 var(--display);margin:0 0 8px}
.gate p{color:#c9c7d3;max-width:56ch;margin:0 auto 18px;font-size:14.5px}
.gate-alt{margin:16px auto 0;max-width:56ch;font-size:13.5px;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.btn.big{height:46px;padding:0 24px;font-size:16px}
.testbox{margin-top:14px;padding:12px 14px;border:1px dashed rgba(242,193,78,.45);border-radius:9px;background:var(--goldbg)}
.testbox b{color:var(--gold)}
.testbox p{margin:6px 0 10px;color:#c9c7d3;font-size:13px}
.testbox p b{color:var(--text)}
.linked{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.panel .linked + p{margin-top:4px}
.landing-en{font:700 12px/1 var(--mono);letter-spacing:.3em;color:var(--red2);margin:-2px 0 14px}
.sheet.wide{max-width:780px}
.check{display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer;user-select:none}
.check input{accent-color:var(--red);width:16px;height:16px;margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.sprite{image-rendering:pixelated;object-fit:contain}
.pk-search{position:relative}
.pk-results{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;max-height:300px;overflow:auto;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.pk-opt{display:flex;align-items:center;gap:10px;width:100%;padding:2px 12px 2px 6px;border:0;background:none;text-align:left;cursor:pointer;font-size:14px}
.pk-opt:hover,.pk-opt.on{background:var(--redbg)}
.pk-opt img{width:44px;height:44px}
.pk-opt small{margin-left:auto;font:500 11px var(--mono);color:var(--dim)}
.pk-none{padding:12px;color:var(--muted);font-size:13px}
.pk-picked{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:4px 12px 4px 4px}
.pk-picked img{width:76px;height:76px}
.pk-picked .nm{flex:1;min-width:0}
.pk-picked .nm b{display:block;font-size:17px}
.pk-picked .nm small{font:500 11px var(--mono);color:var(--dim)}
.shiny{color:var(--gold)}
.pk-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px}
.ivbox{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:center;margin-bottom:12px}
.iv-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.iv-head label{font-size:13px;font-weight:600;color:#c9c7d3}
.iv-head .btns{display:flex;gap:4px}
.iv-head .btns button{height:24px;padding:0 8px;font-size:12px}
.iv-row{display:grid;grid-template-columns:64px minmax(0,1fr) 50px auto;gap:8px;align-items:center;font-size:13px;padding:2px 0}
.iv-row .lb{font-weight:600}
.iv-row .lb.up{color:#ff5a5f}.iv-row .lb.dn{color:#5b8cff}
.iv-row input[type=range]{accent-color:var(--red);width:100%;margin:0}
.iv-row .iv-num{height:30px;padding:0 4px;text-align:center;font-family:var(--mono)}
.iv-row.any input[type=range],.iv-row.any .iv-num{opacity:.28}
.iv-row .check{font-size:12px;color:var(--muted);gap:4px}
.hexbox{background:#29292e;border:1px solid var(--line);border-radius:12px;padding:4px}
.hexbox svg{display:block;width:100%;height:auto}
.hx-ring{fill:none;stroke:#55555d;stroke-width:1.6}
.hx-axis{stroke:#3d3d44;stroke-width:1}
.hx-fill{fill:rgba(56,182,214,.78);stroke:#5fd0ea;stroke-width:1.5;stroke-linejoin:round}
.hx-line{fill:none;stroke:#5fd0ea;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.hx-dot{fill:#bdf2ff}
.hx-center{fill:#7fd6ea}
.hx-lb{font:600 13px 'Pretendard Variable',sans-serif;fill:#e8e8ee}
.hx-val{font:700 13px 'JetBrains Mono',monospace;fill:#fff}
.hx-val.any{fill:#77777f}
.hx-lb.up{fill:#ff5a5f}.hx-lb.dn{fill:#5b8cff}
.gold-icon{width:16px;height:16px;image-rendering:pixelated;vertical-align:-3px;flex:none}
.gold-in{display:flex;align-items:center;gap:8px}
.gold-in .input{max-width:150px;min-width:72px;font-family:var(--mono)}
.gold-in .muted{white-space:nowrap;font-size:13px}
.gold-in .sign{font:700 15px var(--mono);color:var(--muted);width:12px;text-align:center}
.pkv{display:grid;grid-template-columns:auto minmax(0,1fr) 92px;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 4px}
.pkv .ic{width:72px;height:72px}
.pkv ul{list-style:none;margin:0;padding:0;font-size:13px;display:grid;gap:3px;min-width:0}
.pkv li{word-break:break-word}
.pkv li>span:first-child{color:var(--muted);margin-right:6px;font-size:12px}
.pkv .ivg{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;border-top:1px solid var(--line);padding:6px 0 0 6px;text-align:center;white-space:nowrap;font:600 12.5px/1.5 var(--mono);color:#ecebf1}
.pkv .ivg em{display:block;font:500 11px 'Pretendard Variable',sans-serif;font-style:normal;color:var(--muted)}
.pkv .ivg i{font-style:normal;color:var(--dim)}
.pkv .ivg .up{color:#ff5a5f}.pkv .ivg .dn{color:#5b8cff}
.hexmini{background:#29292e;border-radius:9px;padding:2px}
.hexmini svg{display:block;width:100%;height:auto}
.reward{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:14px;background:var(--goldbg);border:1px solid rgba(242,193,78,.25);border-radius:9px;padding:8px 10px}
.reward .g{display:inline-flex;align-items:center;gap:6px;font:700 16px var(--mono);color:var(--gold)}
.reward .line{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font:600 12.5px var(--mono);color:#efe3bf}
.reward .line em{font:500 12px 'Pretendard Variable',sans-serif;font-style:normal;color:#b9ab84;margin-right:4px}
.reward .line i{font-style:normal;color:#8d8366}
.reward .line .per{white-space:nowrap}
.reward .line small{font:600 11.5px var(--mono);color:#b9ab84;margin-left:1px}
.reward .line .gold-icon{width:14px;height:14px;vertical-align:-2px;margin:0 2px}
.reward .strict{color:#ff5a5f;font:700 12.5px 'Pretendard Variable',sans-serif}
.lv-row{display:flex;align-items:center;gap:8px}
.lv-row .input{max-width:90px;font-family:var(--mono)}
.lv-row .input:disabled{opacity:.35}
.gold-in .input:disabled{opacity:.35}
.gold-in .check{margin-left:6px;font-size:13px;white-space:nowrap}
.reward .other{flex-basis:100%;font-size:13px}
.reward .other b{color:var(--gold)}
.chip.time{color:#c9c7d3}
.loading{padding:60px 0;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px;letter-spacing:.1em}

  no_java:'이 계정에는 마인크래프트 자바 에디션이 없어요.',
};

/* ---------- 유틸 ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n) => String(n).padStart(4, '0');
function ago(iso){
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return '방금';
  if (s < 3600) return `${Math.floor(s/60)}분 전`;
  if (s < 86400) return `${Math.floor(s/3600)}시간 전`;
  if (s < 86400*7) return `${Math.floor(s/86400)}일 전`;
  return new Date(iso).toLocaleDateString('ko-KR', { month:'short', day:'numeric' });
}
function avatar(p){
  if (p?.discord_avatar) return `<span class="av"><img src="${esc(p.discord_avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer"></span>`;
  const ch = (p?.mc_name || p?.discord_name || '?').trim().charAt(0).toUpperCase();
  return `<span class="av">${esc(ch)}</span>`;
}
const nameOf = (p) => p?.mc_name || p?.discord_name || '알 수 없음';
function toast(msg, kind=''){
  const el = document.createElement('div');
  el.className = `toast ${kind}`; el.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.remove(), kind === 'err' || kind === 'warn' ? 6500 : 3800);
}


/* ---------- 마감 시각 ---------- */
const isOpen = (p) => p.status === 'open' && (!p.closes_at || new Date(p.closes_at) > new Date());
function leftText(iso){
  const s = (new Date(iso) - Date.now()) / 1000;
  if (s <= 0) return '마감';
  if (s < 3600) return `${Math.max(1, Math.floor(s/60))}분 남음`;
  if (s < 86400) return `${Math.floor(s/3600)}시간 남음`;
  const d = Math.floor(s/86400), h = Math.floor((s % 86400) / 3600);
  return h ? `${d}일 ${h}시간 남음` : `${d}일 남음`;
}
const WD = ['일','월','화','수','목','금','토'];
function fmtDate(iso){
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function localInputValue(d){
  const z = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`;
}
const won = (n) => Number(n || 0).toLocaleString('ko-KR');
const GOLD = '<img class="gold-icon" src="assets/gold.png" alt="골드">';

/* ---------- 포켓몬 데이터 ---------- */
// 육각형 꼭짓점 순서: 위(체력)부터 시계 방향
const STATS = [
  { k:'hp', n:'체력' }, { k:'atk', n:'공격' }, { k:'def', n:'방어' },
  { k:'spe', n:'스피드' }, { k:'spd', n:'특수방어' }, { k:'spa', n:'특수공격' },
];
const STAT_NAME = Object.fromEntries(STATS.map(x => [x.k, x.n]));
const STAT_ROWS = ['hp','atk','def','spa','spd','spe'].map(k => STATS.find(x => x.k === k));
const STAT_SHORT = { hp:'체력', atk:'공격', def:'방어', spa:'특공', spd:'특방', spe:'스피드' };
const SPR = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
let DEX = null;
async function loadDex(){
  if (DEX) return DEX;
  const r = await fetch('assets/pokemon.json');
  if (!r.ok) throw new Error('포켓몬 목록을 불러오지 못했어요.');
  const d = await r.json();
  d.byId = new Map(d.list.map(x => [x[0], x]));
  d.natureByKey = new Map(d.natures.map(n => [n[0], n]));
  return (DEX = d);
}
function spriteUrl(id, shiny, flags=15){
  if (shiny && (flags & 2)) return `${SPR}shiny/${id}.png`;
  if (shiny && (flags & 8)) return `${SPR}other/home/shiny/${id}.png`;
  if (flags & 1) return `${SPR}${id}.png`;
  return `${SPR}other/home/${id}.png`;
}
const natureLabel = (n) => n[2] ? `${n[1]} (${STAT_NAME[n[2]]}▲ ${STAT_NAME[n[3]]}▼)` : `${n[1]} (보정 없음)`;
const pkTitle = (pk) => `${pk.shiny ? '✨ ' : ''}${pk.name}`;

/* 육각형 그래프: ivs = {hp:31|null, ...}, nature = {up, dn} | null */
function hexSvg(ivs, nature, { labels=true } = {}){
  const W = labels ? 300 : 120, H = labels ? 270 : 120;
  const cx = W/2, cy = labels ? 136 : 60, R = labels ? 78 : 50;
  const pt = (i, r) => { const a = (-90 + 60*i) * Math.PI / 180; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };
  const P = (p) => p.map(n => n.toFixed(1)).join(',');
  const ring = (r) => STATS.map((_, i) => P(pt(i, r))).join(' ');
  let out = [1, 2/3, 1/3].map(f => `<polygon class="hx-ring" points="${ring(R*f)}"/>`).join('');
  out += STATS.map((_, i) => `<line class="hx-axis" x1="${cx}" y1="${cy}" x2="${pt(i,R)[0].toFixed(1)}" y2="${pt(i,R)[1].toFixed(1)}"/>`).join('');
  // 정한 능력치는 꼭짓점, 상관없음인 자리는 정가운데 점으로 이어서 그림
  const set = STATS.map((x, i) => ivs?.[x.k] == null ? null : i);
  const given = set.filter(i => i !== null);
  const pts = given.map(i => pt(i, R * Math.max(.05, ivs[STATS[i].k] / 31)));
  if (given.length) {
    const ring = [];
    STATS.forEach((x, i) => {
      const p = set[i] === null ? [cx, cy] : pts[given.indexOf(i)];
      const last = ring[ring.length - 1];
      if (!(last && last[0] === p[0] && last[1] === p[1])) ring.push(p);
    });
    if (ring.length > 1 && ring[0][0] === ring.at(-1)[0] && ring[0][1] === ring.at(-1)[1]) ring.pop();
    const area = (r) => Math.abs(r.reduce((a, p, i) => { const q = r[(i + 1) % r.length]; return a + p[0]*q[1] - q[0]*p[1]; }, 0)) / 2;
    // 하나씩 건너뛰어 정하면(예: 체력·방어·특수방어) 가운데를 오가며 면적이 사라지므로 정한 점끼리만 이음
    const useRing = !(given.length >= 3 && area(ring) < R * R * 0.05);
    const shape = useRing ? ring : pts;
    // 1개만 정했거나 정반대 두 개만 정하면 면적이 없어 굵은 선으로 표시
    const flat = given.length === 1 || (given.length === 2 && given[1] - given[0] === 3);
    out += flat ? `<polyline class="hx-line" points="${shape.map(P).join(' ')} ${P(shape[0])}"/>`
                : `<polygon class="hx-fill" points="${shape.map(P).join(' ')}"/>`;
    // 양옆이 모두 상관없음인 꼭짓점은 가운데와 잇는 선이 얇아 보이므로 굵게 표시
    if (useRing && !flat) given.forEach((i, n) => {
      if (set[(i + 5) % 6] === null && set[(i + 1) % 6] === null)
        out += `<line class="hx-line" x1="${cx}" y1="${cy}" x2="${pts[n][0].toFixed(1)}" y2="${pts[n][1].toFixed(1)}"/>`;
    });
    if (given.length < 6 && useRing) out += `<circle class="hx-dot hx-center" cx="${cx}" cy="${cy}" r="${labels ? 2.4 : 1.8}"/>`;
  }
  out += pts.map(p => `<circle class="hx-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${labels ? 3 : 2.4}"/>`).join('');
  if (labels) {
    STATS.forEach((x, i) => {
      const [lx, ly] = pt(i, R + (i === 0 || i === 3 ? 18 : 14));
      const anchor = i === 0 || i === 3 ? 'middle' : i < 3 ? 'start' : 'end';
      const y0 = i === 0 ? ly - 16 : i === 3 ? ly + 4 : ly - 6;
      const cls = nature?.up === x.k ? 'up' : nature?.dn === x.k ? 'dn' : '';
      const mark = cls === 'up' ? '▲ ' : cls === 'dn' ? '▼ ' : '';
      const v = ivs?.[x.k];
      out += `<text class="hx-lb ${cls}" x="${lx.toFixed(1)}" y="${y0.toFixed(1)}" text-anchor="${anchor}">${mark}${x.n}</text>`;
      out += `<text class="hx-val ${v == null ? 'any' : ''}" x="${lx.toFixed(1)}" y="${(y0 + 16).toFixed(1)}" text-anchor="${anchor}">${v == null ? '상관없음' : v}</text>`;
    });
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="개체값 육각형 그래프">${out}</svg>`;
}

/* 포켓몬 입력 폼 (allowAny: 상관없음 허용) */
function pkEditorHtml(allowAny, withLevel=false){
  const ivRows = STAT_ROWS.map(x => `
    <div class="iv-row" data-stat="${x.k}">
      <span class="lb">${x.n}</span>
      <input type="range" min="0" max="31" value="31" data-iv="${x.k}" aria-label="${x.n} 개체값">
      <input type="number" min="0" max="31" value="31" class="input iv-num" data-ivn="${x.k}" aria-label="${x.n} 개체값 숫자">
      ${allowAny ? `<label class="check"><input type="checkbox" data-ivany="${x.k}">상관없음</label>` : '<span></span>'}
    </div>`).join('');
  const natures = DEX.natures.map(n => `<option value="${n[0]}">${esc(natureLabel(n))}</option>`).join('');
  return `
  <div class="pkx" data-any="${allowAny ? 1 : 0}">
    <div class="field"><label>포켓몬</label>

let PK = null; // 현재 폼 상태
function bindPkEditor(allowAny){
  PK = { sel:null, allowAny };
  const root = $('#mform'), q = $('#pk-q'), res = $('#pk-res');
  if (allowAny) root.querySelectorAll('[data-ivany]').forEach(c => { c.checked = true; });
  let hits = [], hi = 0;
  const showRes = (open) => { res.hidden = !open; q.setAttribute('aria-expanded', open ? 'true' : 'false'); };
  const renderRes = () => {
    if (!hits.length) { res.innerHTML = '<div class="pk-none">검색 결과가 없어요.</div>'; return; }
    res.innerHTML = hits.map((x, i) => `<button type="button" class="pk-opt ${i === hi ? 'on' : ''}" data-act="pk-pick" data-id="${x[0]}" role="option">
      <img class="sprite" src="${spriteUrl(x[0], false, x[5])}" alt="" loading="lazy">${esc(x[1])}<small>No.${String(x[6]).padStart(4,'0')}</small></button>`).join('');
  };
  q.addEventListener('input', () => {
    const t = q.value.trim().toLowerCase().replace(/\s+/g, ' ');
    if (!t) { showRes(false); return; }
    const num = /^\d+$/.test(t) ? Number(t) : null;
    hits = DEX.list.filter(x => num ? x[6] === num : (x[1].toLowerCase().includes(t) || x[2].includes(t))).slice(0, 40);
    hi = 0; renderRes(); showRes(true);
  });
  q.addEventListener('keydown', (e) => {
    if (res.hidden) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); hi = Math.max(0, Math.min(hits.length - 1, hi + (e.key === 'ArrowDown' ? 1 : -1))); renderRes();
      res.querySelector('.pk-opt.on')?.scrollIntoView({ block:'nearest' });
    } else if (e.key === 'Enter') { e.preventDefault(); if (hits[hi]) pickPk(hits[hi][0]); }
    else if (e.key === 'Escape') { e.stopPropagation(); showRes(false); }
  });
  root.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.iv) { root.querySelector(`[data-ivn="${t.dataset.iv}"]`).value = t.value; ivUntick(t.dataset.iv); }
    else if (t.dataset.ivn) {
      const v = Math.max(0, Math.min(31, Number(t.value) || 0));
      root.querySelector(`[data-iv="${t.dataset.ivn}"]`).value = v; ivUntick(t.dataset.ivn);
    }
    drawPkHex();
  });
  root.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.ivn) t.value = Math.max(0, Math.min(31, Math.round(Number(t.value) || 0)));
    if (t.id === 'pk-shiny') updatePicked();
    if (t.dataset.ivany) t.closest('.iv-row').classList.toggle('any', t.checked);
    drawPkHex();
  });
  root.querySelectorAll('[data-ivany]').forEach(c => c.closest('.iv-row').classList.toggle('any', c.checked));
  $('#pk-lv-any')?.addEventListener('change', (e) => {
    $('#pk-lv').disabled = e.target.checked;
    if (!e.target.checked) $('#pk-lv').focus();
    root.dispatchEvent(new CustomEvent('lvchange'));
  });
  drawPkHex();
}
function ivUntick(k){
  const c = $(`#mform [data-ivany="${k}"]`);
  if (c?.checked) { c.checked = false; c.closest('.iv-row').classList.remove('any'); }
}
function pickPk(id){
  const x = DEX.byId.get(Number(id)); if (!x) return;
  PK.sel = x;
  $('#pk-res').hidden = true; $('#pk-search').hidden = true; $('#pk-picked').hidden = false;
  const ab = $('#pk-ability');
  const opts = x[3].map(a => `<option value="${a}">${esc(DEX.abilities[a])}</option>`).join('')
    + (x[4] ? `<option value="${x[4]}">${esc(DEX.abilities[x[4]])} (숨겨진 특성)</option>` : '');
  ab.innerHTML = (PK.allowAny ? '<option value="">상관없음</option>' : '') + opts;
  ab.disabled = false;
  updatePicked();
}
function updatePicked(){
  const x = PK?.sel; if (!x) return;
  const shiny = $('#pk-shiny').checked;
  $('#pk-img').src = spriteUrl(x[0], shiny, x[5]);
  $('#pk-name').innerHTML = `${shiny ? '<span class="shiny">✨</span> ' : ''}${esc(x[1])}`;
  $('#pk-no').textContent = `No.${String(x[6]).padStart(4,'0')}${shiny ? ' · 이로치' : ''}`;
}
function readIvs(){
  const ivs = {};
  STATS.forEach(x => {
    const any = $(`#mform [data-ivany="${x.k}"]`)?.checked;
    ivs[x.k] = any ? null : Math.max(0, Math.min(31, Math.round(Number($(`#mform [data-ivn="${x.k}"]`).value) || 0)));
  });
  return ivs;
}
function readNature(){
  const k = $('#pk-nature')?.value;
  const n = k && DEX.natureByKey.get(k);
  return n ? { k:n[0], n:n[1], up:n[2] || null, dn:n[3] || null } : null;
}
function drawPkHex(){ const h = $('#pk-hex'); if (h) h.innerHTML = hexSvg(readIvs(), readNature()); }
function readPk(){
  const x = PK?.sel;
  if (!x) throw new Error('포켓몬을 검색해서 골라 주세요.');
  const shiny = $('#pk-shiny').checked;
  const a = $('#pk-ability').value;
  if (!PK.allowAny && !a) throw new Error('특성을 골라 주세요.');
  const nature = readNature();
  if (!PK.allowAny && !nature) throw new Error('성격을 골라 주세요.');
  let level;
  if ($('#pk-lv')) {
    if ($('#pk-lv-any').checked) level = null;
    else {
      level = Number($('#pk-lv').value);
      if (!Number.isInteger(level) || level < 1 || level > 100) throw new Error('최대 레벨은 1~100 사이로 적어 주세요.');
    }
  }
  return {
    id:x[0], name:x[1], shiny, icon:spriteUrl(x[0], shiny, x[5]),
    ability: a ? { n:DEX.abilities[a], hidden:Number(a) === x[4] } : null,
    nature, ivs:readIvs(), ...(level !== undefined ? { level } : {}),
  };
}

/* 카드에 보여줄 포켓몬 정보 */
function pkView(pk){
  const nat = pk.nature;
  const ivl = STAT_ROWS.map(x => {
    const v = pk.ivs?.[x.k];
    const cls = nat?.up === x.k ? 'up' : nat?.dn === x.k ? 'dn' : '';
    return `<span><em class="${cls}">${STAT_SHORT[x.k]}</em>${v == null ? '<i>—</i>' : v}</span>`;
  }).join('');
  return `<div class="pkv">
    <img class="sprite ic" src="${esc(pk.icon)}" alt="${esc(pk.name)}" loading="lazy">
    <ul>
      <li><span>특성</span>${pk.ability ? `${esc(pk.ability.n)}${pk.ability.hidden ? ' <span class="chip">숨특</span>' : ''}` : '상관없음'}</li>
      <li><span>성격</span>${nat ? esc(nat.n) : '상관없음'}</li>
      ${pk.level !== undefined ? `<li><span>레벨</span>${pk.level ? `최대 Lv.${pk.level}` : '상관없음'}</li>` : ''}
    </ul>
    <div class="hexmini">${hexSvg(pk.ivs, nat, { labels:false })}</div>
    <div class="ivg">${ivl}</div>
  </div>`;
}
function rewardView(r, pk){
  if (!r) return '';
  const per = (n, step) => `<span class="per">${GOLD}${won(n)}<small>/${step}</small></span>`;
  const strict = '<b class="strict">타협 불가</b>';
  const hasIv = !pk || STATS.some(x => pk.ivs?.[x.k] != null);
  const ivParts = [r.strict ? strict : r.less ? per(r.less, '−1') : '', r.more ? per(r.more, '+1') : ''].filter(Boolean);
  const lvParts = pk?.level ? [r.lvStrict ? strict : r.lvLess ? per(r.lvLess, '−1') : ''].filter(Boolean) : [];
  const line = (label, parts) => parts.length ? `<span class="line"><em>${label}</em>${parts.join('<i>·</i>')}</span>` : '';
  return `<div class="reward"><span class="g">${GOLD}${won(r.gold)}</span>
    ${hasIv ? line('요구 개체값', ivParts) : ''}
    ${line(`레벨 (최대 Lv.${pk?.level})`, lvParts)}
    ${r.other ? `<span class="other"><b>+</b> ${esc(r.other)}</span>` : ''}</div>`;
}

let modalState = null;
function openForm({ title, sub='', html='', submit='확인', danger=false, wide=false, onSubmit, onCancel, onOpen }){
  modalState = { onSubmit, onCancel };
  $('#modal').innerHTML = `
    <form class="sheet ${wide ? 'wide' : ''}" id="mform" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate>
      <h3>${esc(title)}</h3>${sub ? `<p class="sub">${sub}</p>` : ''}
      ${html}
      <div class="foot">
        <button type="button" class="btn ghost" data-act="close-modal">취소</button>
        <button type="submit" class="btn ${danger ? 'danger' : 'red'}">${esc(submit)}</button>
      </div>
    </form>`;
  $('#modal').hidden = false;
  onOpen?.();
  setTimeout(() => $('#mform input:not([type=hidden]):not([type=checkbox]), #mform textarea')?.focus(), 30);
}
function closeModal(cancelled=true){
  if (cancelled) modalState?.onCancel?.();
  modalState = null;
  $('#modal').hidden = true; $('#modal').innerHTML = '';
}
function ask(title, text, submit='확인', danger=false){
  return new Promise(res => openForm({ title, sub:esc(text), submit, danger, onSubmit:() => res(true), onCancel:() => res(false) }));
}
document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'mform') return;
  e.preventDefault();
  const bad = [...e.target.querySelectorAll('[required]')].find(el => !el.hidden && !el.disabled && !String(el.value).trim());
  if (bad) { toast(`${bad.closest('.field')?.querySelector('label')?.textContent || '필수 칸'}을(를) 채워 주세요.`, 'err'); bad.focus(); return; }
  const btn = e.target.querySelector('[type=submit]'); btn.disabled = true;
  const data = Object.fromEntries(new FormData(e.target));
  try {
    const st = modalState; modalState = { ...st, onCancel:null };
    await st.onSubmit(data);
    closeModal(false);
  } catch (err) { toast(err.message || String(err), 'err'); btn.disabled = false; }
});
$('#modal').addEventListener('mousedown', (e) => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

   데이터 계층 — Supabase
   ===================================================================== */
function makeSupaApi(){
  const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const AUTH = 'author:profiles(id,mc_name,discord_name,discord_avatar)';
  const run = async (p) => { const { data, error } = await p; if (error) throw new Error(friendly(error)); return data; };
  function friendly(e){
    const m = e.message || '';
    if (/row-level security|permission denied/i.test(m)) return '권한이 없어요.';
    if (/duplicate key/i.test(m)) return '이미 처리된 요청이에요.';
    if (/profiles_verified_mc_name/i.test(m)) return '이미 다른 사람이 인증받은 닉네임이에요.';
    if (/mc_name_check/i.test(m)) return '닉네임은 영문, 숫자, _ 만 쓸 수 있어요 (최대 16자).';
    return m;
  }
  async function call(path, body){
    const { data:{ session } } = await sb.auth.getSession();
    const r = await fetch(path, { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${session?.access_token||''}` }, body:JSON.stringify(body||{}) });
    let j = {}; try { j = await r.json(); } catch {}
    if (!r.ok) throw new Error(j.error || `서버 오류 (${r.status})`);
    return j;
  }
  return {
    demo:false,
    onAuth(cb){ sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') cb(); }); },
    login(){ return sb.auth.signInWithOAuth({ provider:'discord', options:{ redirectTo: location.origin + location.pathname } }); },
    async logout(){ await sb.auth.signOut(); },
    async me(){
      const { data:{ session } } = await sb.auth.getSession();
      if (!session) return null;
      const p = await run(sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle());
      if (!p) throw new Error('프로필이 없어요. Supabase에 schema.sql을 실행했는지 확인해 주세요.');
      const md = session.user.user_metadata || {};
      const dn = md.custom_claims?.global_name || md.full_name || md.name || p.discord_name;
      const da = md.avatar_url || null;
      if (dn !== p.discord_name || da !== p.discord_avatar) {
        await sb.from('profiles').update({ discord_name:dn, discord_avatar:da }).eq('id', p.id);
        p.discord_name = dn; p.discord_avatar = da;
      }
      const acc = await run(sb.rpc('my_access'));
      return { ...p, acc };
    },
    listPosts(boards, limit=60){
      return run(sb.from('posts')
        .select(`*, ${AUTH}, entries(id,user_id,message,created_at,user:profiles(id,mc_name,discord_name,discord_avatar))`)
        .in('board', [].concat(boards)).order('created_at', { ascending:false }).limit(limit));
    },
    createPost(d){ return run(sb.from('posts').insert(d).select().single()); },
    setPostStatus(id, status){ return run(sb.from('posts').update({ status }).eq('id', id)); },
    updatePost(id, patch){ return run(sb.from('posts').update(patch).eq('id', id)); },
    deletePost(id){ return run(sb.from('posts').delete().eq('id', id)); },
    createEntry(post_id, message){ return run(sb.from('entries').insert({ post_id, message }).select().single()); },
    deleteEntry(id){ return run(sb.from('entries').delete().eq('id', id)); },
    listListings(kind){
      return run(sb.from('rocket_listings')
        .select(`*, ${AUTH}, rocket_reservations(id,status,requester_id)`)
        .eq('kind', kind).order('created_at', { ascending:false }).limit(100));
    },
    createListing(d){ return run(sb.from('rocket_listings').insert(d).select().single()); },
    setListingStatus(id, status){ return run(sb.from('rocket_listings').update({ status }).eq('id', id)); },
    deleteListing(id){ return run(sb.from('rocket_listings').delete().eq('id', id)); },
    createReservation(listing_id, message){ return run(sb.from('rocket_reservations').insert({ listing_id, message }).select().single()); },
    listReservations(){
      return run(sb.from('rocket_reservations')
        .select('*, listing:rocket_listings(id,kind,pokemon,details,author_id,author:profiles(id,mc_name,discord_name,discord_avatar)), requester:profiles(id,mc_name,discord_name,discord_avatar)')
        .order('created_at', { ascending:false }).limit(100));
    },
    setReservationStatus(id, status){ return run(sb.from('rocket_reservations').update({ status }).eq('id', id)); },
    async setMcName(id, mc_name){ return run(sb.from('profiles').update({ mc_name }).eq('id', id)); },
    listProfiles(){ return run(sb.from('profiles').select('*').order('created_at', { ascending:true })); },
    async fixedAdmins(){ return (await run(sb.from('fixed_admins').select('mc_name'))).map(r => r.mc_name); },
    updateProfile(id, patch){ return run(sb.from('profiles').update(patch).eq('id', id)); },
    async notify(type, id){ try { return await call('/api/notify', { type, id }); } catch (e) { return { ok:false, error:e.message }; } },
    async msStart(){ const j = await call('/api/ms-start'); location.href = j.url; },
  };
}

        meta:{ pk:demoPk(132, '메타몽', false, { n:'괴짜', hidden:true }, { k:'hardy', n:'노력', up:null, dn:null }, { hp:31, atk:31, def:31, spe:31, spd:31, spa:0 }) } },
      { id:2, kind:'have', pokemon:'두랄루돈', details:'Lv.45 · 성격 고집', status:'open', author_id:'u2', created_at:t(26) },
      { id:3, kind:'need', pokemon:'✨ 저리더프', details:'진화용 · 레벨 무관', status:'open', author_id:'u2', created_at:t(2),
        meta:{ pk:{ ...demoPk(848, '저리더프', true, null, null, { hp:null, atk:null, def:null, spe:31, spd:null, spa:null }), level:30 } } },
      { id:4, kind:'need', pokemon:'히바니', details:'숨겨진 특성(리베로)이면 좋아요', status:'done', author_id:'u3', created_at:t(80) },
    ],
    reservations:[
      { id:1, listing_id:2, requester_id:'u3', message:'오늘 밤 10시에 접속해요!', status:'pending', created_at:t(1) },
    ],
  };
  let role = 'new', loggedIn = false, seq = 100;
  const meId = () => ({ new:'u5', member:'u4', rocket:'u2', admin:'u1' })[role];
  const prof = (id) => D.profiles.find(p => p.id === id);
  const pub = (p) => p && { id:p.id, mc_name:p.mc_name, discord_name:p.discord_name, discord_avatar:null };
  const isFixed = (p) => !!p && p.mc_verified && D.fixed.some(f => f.toLowerCase() === String(p.mc_name).toLowerCase());
  const access = (p) => { const fixed = isFixed(p), admin = fixed || p.role === 'admin'; return { fixed, admin, rocket: admin || p.role === 'rocket', verified: !!p.mc_verified }; };
  const newest = (a, b) => new Date(b.created_at) - new Date(a.created_at);
  const nowIso = () => new Date().toISOString();
  const pause = () => new Promise(r => setTimeout(r, 90));
  const byId = (arr, id) => arr.find(x => x.id === id);
  return {
    demo:true,
    get role(){ return role; }, get loggedIn(){ return loggedIn; },
    setRole(r){ role = r; loggedIn = true; },
    onAuth(){},
    async login(){ await pause(); loggedIn = true; role = 'new'; toast('(데모) 디스코드 로그인 완료 — 처음 가입한 회원 시점이에요.'); },
    async logout(){ loggedIn = false; },
    async me(){ if (!loggedIn) return null; const p = prof(meId()); return { ...p, acc:access(p) }; },
    async listPosts(boards, limit=60){
      await pause(); const bs = [].concat(boards);
      return D.posts.filter(p => bs.includes(p.board)).sort(newest).slice(0, limit).map(p => ({
        ...p, author:pub(prof(p.author_id)),
        entries:D.entries.filter(e => e.post_id === p.id).map(e => ({ ...e, user:pub(prof(e.user_id)) })),
      }));
    },
    async createPost(d){
      const me = meId(), admin = access(prof(me)).admin;
      if (['notice', 'pvp', 'auction'].includes(d.board) && !admin) throw new Error('권한이 없어요.');
      if (d.board === 'request' && !admin) {
        if (D.posts.some(p => p.board === 'request' && p.author_id === me && isOpen(p))) throw new Error('이미 모집 중인 포켓몬 의뢰가 있어요. 기존 의뢰가 마감된 뒤에 올릴 수 있어요.');
        d = { ...d, closes_at:new Date(Date.now() + 7*86400e3).toISOString() };
      }
      if ((d.board === 'pvp' || d.board === 'auction') && !d.closes_at) d = { ...d, closes_at:new Date(Date.now() + 7*86400e3).toISOString() };
      const p = { id:++seq, closes_at:null, ...d, status:'open', author_id:me, created_at:nowIso() }; D.posts.push(p); return p;
    },
    async setPostStatus(id, s){
      const p = byId(D.posts, id);
      if (p.board === 'request' && !access(prof(meId())).admin && s === 'open' && p.status !== 'open') throw new Error('마감된 의뢰는 다시 열 수 없어요. 새 의뢰를 올려 주세요.');
      p.status = s;
    },
    async updatePost(id, patch){
      const p = byId(D.posts, id);
      if ((p.board === 'pvp' || p.board === 'auction') && 'closes_at' in patch && !patch.closes_at) patch = { ...patch, closes_at:new Date(Date.now() + 7*86400e3).toISOString() };
      Object.assign(p, patch);
    },
    async deletePost(id){ D.posts = D.posts.filter(p => p.id !== id); D.entries = D.entries.filter(e => e.post_id !== id); },
    async createEntry(post_id, message){ if (D.entries.some(e => e.post_id === post_id && e.user_id === meId())) throw new Error('이미 처리된 요청이에요.'); const e = { id:++seq, post_id, user_id:meId(), message, created_at:nowIso() }; D.entries.push(e); return e; },
    async deleteEntry(id){ D.entries = D.entries.filter(e => e.id !== id); },
    async listListings(kind){
      await pause();
      return D.listings.filter(l => l.kind === kind).sort(newest).map(l => ({
        ...l, author:pub(prof(l.author_id)),
        rocket_reservations:D.reservations.filter(r => r.listing_id === l.id).map(r => ({ id:r.id, status:r.status, requester_id:r.requester_id })),
      }));
    },
    async createListing(d){ const l = { id:++seq, ...d, status:'open', author_id:meId(), created_at:nowIso() }; D.listings.push(l); return l; },
    async setListingStatus(id, s){ byId(D.listings, id).status = s; },
    async deleteListing(id){ D.listings = D.listings.filter(l => l.id !== id); D.reservations = D.reservations.filter(r => r.listing_id !== id); },
    async createReservation(listing_id, message){ const r = { id:++seq, listing_id, requester_id:meId(), message, status:'pending', created_at:nowIso() }; D.reservations.push(r); return r; },
    async listReservations(){
      await pause(); const me = meId(), admin = access(prof(me)).admin;
      return D.reservations.filter(r => admin || r.requester_id === me || byId(D.listings, r.listing_id)?.author_id === me).sort(newest).map(r => {
        const l = byId(D.listings, r.listing_id);
        return { ...r, listing:{ ...l, author:pub(prof(l.author_id)) }, requester:pub(prof(r.requester_id)) };
      });
    },
    async setReservationStatus(id, s){ byId(D.reservations, id).status = s; },
    async setMcName(id, name){ const p = prof(id); p.mc_name = name; p.mc_verified = false; p.mc_verified_via = null; },
    async listProfiles(){ await pause(); return D.profiles.map(p => ({ ...p })); },
    async fixedAdmins(){ return D.fixed.slice(); },
    async updateProfile(id, patch){ const p = prof(id); Object.assign(p, patch); if ('mc_verified' in patch) p.mc_verified_via = patch.mc_verified ? 'admin' : null; },
    async notify(){ await pause(); return { ok:true, demo:true, dm:{ owner:true, requester:true, author:true } }; },
    async msStart(){
      const p = prof(meId());
      toast('(데모) Microsoft 로그인 중… 실제로는 Microsoft 로그인 창으로 이동해요.');
      await new Promise(r => setTimeout(r, 900));
      p.mc_name = p.mc_name || 'Mina_Trainer'; p.mc_verified = true; p.mc_verified_via = 'microsoft';
      toast(`마인크래프트 닉네임 ${p.mc_name} 인증 완료! 이제 활동할 수 있어요.`);
    },
  };
}

const S = { api:null, me:null, rocketTab:'have', memberQuery:'' };
const acc = () => S.me?.acc || {};

function tabList(){
  const t = [['home','홈'],['request','포켓몬 의뢰'],['pvp','PVP 대회'],['auction','경매']];
  if (acc().rocket) t.push(['rocket','로켓단','rk']);
  if (acc().admin) t.push(['admin','관리자','ad']);
  t.push(['me','내 정보']);
  return t;
}
function currentTab(){
  const h = location.hash.slice(1) || 'home';
  return tabList().some(([k]) => k === h) ? h : 'home';
}

function renderShell(){
  const demo = $('#demo');
  demo.hidden = !S.api.demo;
  if (S.api.demo) {
    const roles = { new:'신규 가입', member:'일반', rocket:'로켓단', admin:'관리자' };
    demo.innerHTML = `<div class="wrap"><b>데모 모드</b><span class="muted">가짜 데이터라 저장되지 않아요.</span>
      ${S.api.loggedIn
        ? `<span class="muted">시점 바꾸기:</span><div class="seg">${Object.entries(roles).map(([r, n]) => `<button data-act="demo-role" data-role="${r}" class="${S.api.role === r ? 'on' : ''}">${n}</button>`).join('')}</div>`
        : '<span class="muted">디스코드 로그인 버튼을 눌러 시작해 보세요.</span>'}
      ${CONFIGURED ? '<button class="btn sm ghost" data-act="exit-demo" style="margin-left:auto">데모 끝내기</button>' : ''}</div>`;
  }
  const me = S.me, a = acc();
  $('#userbox').innerHTML = !me ? '' : `
    ${a.fixed ? '<span class="chip gold">고정 관리자</span>' : a.admin ? '<span class="chip gold">관리자</span>' : a.rocket ? '<span class="chip red">로켓단</span>' : !a.verified ? '<span class="chip gold">미연동</span>' : ''}
    <a class="who" href="#me">${avatar(me)}<span class="nm">${esc(nameOf(me))}</span></a>
    <button class="btn sm ghost" data-act="logout">로그아웃</button>`;
  const cur = currentTab();
  $('#tabs').innerHTML = !me ? '' : tabList().map(([k, label, cls]) =>
    `<a class="tab ${cls||''} ${k === cur ? 'on' : ''}" href="#${k}">${label}</a>`).join('');
}

async function renderView(){
  const v = $('#view');
  if (!S.me) { v.innerHTML = landing(); return; }
  const tab = currentTab();
  document.querySelectorAll('.tab').forEach(a => a.classList.toggle('on', a.getAttribute('href') === `#${tab}`));
  $('.tab.on')?.scrollIntoView({ block:'nearest', inline:'center' });
  v.innerHTML = '<div class="loading">LOADING…</div>';
  try {
    let html = '';
    if (tab === 'home') html = await viewHome();
    else if (BOARDS[tab]) html = await viewBoard(tab);
    else if (tab === 'rocket') html = await viewRocket();
    else if (tab === 'admin') html = await viewAdmin();
    else if (tab === 'me') html = viewMe();
    const banner = !acc().verified && tab !== 'home' && tab !== 'me' ? gateBanner() : '';
    v.innerHTML = banner + html;
  } catch (e) {
    v.innerHTML = `<div class="empty">불러오지 못했어요: ${esc(e.message)}</div>`;
  }
}

async function refresh(){
  try { S.me = await S.api.me(); }
  catch (e) { S.me = null; toast(e.message, 'err'); }
  renderShell();
  await renderView();
}

async function viewBoard(board){
  const B = BOARDS[board], a = acc();
  const posts = await S.api.listPosts(board);
  const writeBtn = B.adminOnly && !a.admin
    ? `<span class="muted" style="font-size:13px">${B.name} 글은 관리자만 올릴 수 있어요.</span>`
    : a.verified
      ? `<button class="btn red" data-act="write" data-board="${board}">+ 글쓰기</button>`
      : `<button class="btn" disabled title="Microsoft 연동 후 이용 가능">연동 후 글쓰기</button>`;
  return `
  <div class="head"><div><div class="code">${B.code}</div><h1>${B.name}</h1><p>${B.desc}</p></div>${writeBtn}</div>
  ${posts.length ? `<div class="grid">${posts.map(postCard).join('')}</div>` : '<div class="empty">아직 글이 없어요.</div>'}`;
}

function postCard(p){
  const B = BOARDS[p.board], a = acc(), me = S.me;
  const mine = p.author_id === me.id;
  const entries = p.entries || [];
  const myEntry = entries.find(e => e.user_id === me.id);
  const cap = Number(String(p.meta?.capacity || '').replace(/[^0-9]/g, '')) || 0;
  const full = cap > 0 && entries.length >= cap;
  const open = isOpen(p);
  const timeUp = p.status === 'open' && !open;
  const pk = p.meta?.pk;

  const kvList = B.fields.filter(f => p.meta?.[f.k] && typeof p.meta[f.k] !== 'object').map(f =>
    `<div class="kv"><span>${esc(f.label)}</span><b>${esc(p.meta[f.k])}${f.k === 'capacity' ? ` · 신청 ${entries.length}` : ''}</b></div>`);
  if (p.closes_at) kvList.push(`<div class="kv"><span>${p.board === 'request' ? '자동 마감' : '신청 마감'}</span><b>${fmtDate(p.closes_at)}</b></div>`);
  const kvs = kvList.join('');

  let join = '';
  if (open && !mine) {
    if (myEntry) join = `<button class="btn sm" data-act="leave" data-id="${myEntry.id}">신청 취소</button>`;
    else if (!a.verified) join = `<button class="btn sm" disabled>연동 후 신청</button>`;
    else if (full) join = `<button class="btn sm" disabled>정원 마감</button>`;
    else join = `<button class="btn sm red" data-act="join" data-id="${p.id}">${B.join}</button>`;
  }
  let manage = '';
  if (mine || a.admin) {
    if (open) manage = `<button class="btn sm ghost" data-act="post-status" data-id="${p.id}" data-status="closed">마감하기</button>`;
    else if (p.board !== 'request' || a.admin)
      manage = timeUp && B.deadline
        ? `<button class="btn sm ghost" data-act="post-deadline" data-id="${p.id}">다시 열기</button>`
        : `<button class="btn sm ghost" data-act="post-status" data-id="${p.id}" data-status="open">다시 열기</button>`;
    if (open && B.deadline) manage += `<button class="btn sm ghost" data-act="post-deadline" data-id="${p.id}">마감 시각</button>`;
  }
  const del = a.admin ? `<button class="btn sm danger" data-act="del-post" data-id="${p.id}">삭제</button>` : '';

  return `
  <article class="card ${open ? '' : 'closed'}">
    <div class="tag"><span class="fid">${B.code} #${pad(p.id)}</span>
      <span style="display:flex;gap:4px">${open && p.closes_at ? `<span class="chip time">${leftText(p.closes_at)}</span>` : ''}<span class="chip ${open ? 'open' : ''}">${open ? '모집중' : '마감'}</span></span></div>
    <h3>${pk ? `${pk.shiny ? '<span class="shiny">✨</span> ' : ''}${esc(pk.name)}` : esc(p.title)}</h3>
    ${pk ? pkView(pk) : ''}
    ${p.meta?.reward ? rewardView(p.meta.reward, pk) : ''}
    ${kvs ? `<div class="kvs">${kvs}</div>` : ''}
    ${p.body ? `<p class="body">${esc(p.body)}</p>` : ''}
    <div class="by">${avatar(p.author)}<strong>${esc(nameOf(p.author))}</strong><span class="mono">· ${ago(p.created_at)}</span></div>
    ${entries.length ? `<details class="ent"><summary>${B.entryLabel} ${entries.length}명</summary><ul>

function listingCard(l){
  const me = S.me, a = acc();
  const mine = l.author_id === me.id, open = l.status === 'open';
  const res = l.rocket_reservations || [];
  const myRes = res.find(r => r.requester_id === me.id && r.status === 'pending');
  const pending = res.filter(r => r.status === 'pending').length;
  let act = '';
  if (open && !mine) {
    act = myRes ? `<button class="btn sm" disabled>예약함</button>`
      : `<button class="btn sm red" data-act="reserve" data-id="${l.id}">${l.kind === 'have' ? '받을게요' : '줄게요'}</button>`;
  }
  const manage = (mine || a.admin)
    ? `<button class="btn sm ghost" data-act="listing-status" data-id="${l.id}" data-status="${open ? 'done' : 'open'}">${open ? '거래 완료' : '다시 열기'}</button>
       <button class="btn sm danger" data-act="del-listing" data-id="${l.id}">삭제</button>` : '';
  return `
  <article class="card ${open ? '' : 'closed'}" data-pokemon="${esc(l.pokemon)}" data-owner="${esc(nameOf(l.author))}" data-kind="${l.kind}">
    <div class="tag"><span class="fid">${l.kind === 'have' ? 'HAVE' : 'NEED'} #${pad(l.id)}</span>
      <span class="chip ${open ? 'open' : ''}">${open ? (l.kind === 'have' ? '드려요' : '구해요') : '완료'}</span></div>
    <h3>${l.meta?.pk ? `${l.meta.pk.shiny ? '<span class="shiny">✨</span> ' : ''}${esc(l.meta.pk.name)}` : esc(l.pokemon)}</h3>
    ${l.meta?.pk ? pkView(l.meta.pk) : ''}
    ${l.details ? `<p class="body">${esc(l.details)}</p>` : ''}
    <div class="by">${avatar(l.author)}<strong>${esc(nameOf(l.author))}</strong><span class="mono">· ${ago(l.created_at)}</span>
      ${mine && pending ? `<span class="chip red" style="margin-left:auto">예약 ${pending}건</span>` : ''}</div>
    ${(act || manage) ? `<div class="actions">${act}${manage}</div>` : ''}
  </article>`;
}

function resRow(r){
  const me = S.me, a = acc();
  const l = r.listing || {};
  const iOwn = l.author_id === me.id, iAsked = r.requester_id === me.id;
  const ownerGives = l.kind === 'have';
  const iGive = (iOwn && ownerGives) || (iAsked && !ownerGives);
  const other = iOwn ? r.requester : l.author;
  const involved = iOwn || iAsked;
  const dir = involved ? `<span class="dir ${iGive ? '' : 'in'}">${iGive ? '내가 줌' : '내가 받음'}</span>`
                       : `<span class="dir">관리자 보기</span>`;
  const st = { pending:'<span class="chip gold">대기</span>', done:'<span class="chip open">완료</span>', cancelled:'<span class="chip">취소</span>' }[r.status];
  const ctl = r.status === 'pending' && (involved || a.admin)
    ? `<button class="btn sm" data-act="res-status" data-id="${r.id}" data-status="done">완료</button>
       <button class="btn sm danger" data-act="res-status" data-id="${r.id}" data-status="cancelled">취소</button>` : '';
  const people = involved
    ? `상대: <b>${esc(nameOf(other))}</b>`
    : `<b>${esc(nameOf(ownerGives ? l.author : r.requester))}</b> → <b>${esc(nameOf(ownerGives ? r.requester : l.author))}</b>`;
  return `<div class="panel res">
    ${dir}
    <div style="min-width:0">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(l.pokemon || '삭제된 글')}</b>${st}<span class="mono muted" style="font-size:12px">#${pad(r.id)} · ${ago(r.created_at)}</span></div>
      <div class="muted" style="font-size:14px;margin-top:4px">${people} · 전할 말: ${esc(r.message)}</div>
    </div>
    <div class="actions" style="margin:0;padding:0">${ctl}</div>
  </div>`;
}

function deadlineField(adminRequest=false){
  return `<div class="field"><label>신청 마감 시각 (선택)</label>
    <input type="datetime-local" class="input" name="closes_at" min="${localInputValue(new Date())}">
    <span class="hint">${adminRequest
      ? '정한 시각이 지나면 자동으로 마감돼요. 비워 두면 직접 마감할 때까지 열려 있어요. (관리자 의뢰)'
      : '정한 시각이 지나면 마감 버튼을 누르지 않아도 자동으로 신청이 닫혀요. <b>비워 두면 일주일 뒤 자동으로 마감돼요.</b>'}</span></div>`;
}
function readDeadline(f){
  if (!f.closes_at) return null;
  const d = new Date(f.closes_at);
  if (isNaN(d)) throw new Error('마감 시각을 다시 확인해 주세요.');
  if (d <= new Date()) throw new Error('마감 시각은 지금보다 뒤여야 해요.');
  return d.toISOString();
}
function intField(v, label){
  const n = Number(String(v ?? '').replace(/[,\s]/g, '') || 0);
  if (!Number.isInteger(n) || n < 0) throw new Error(`${label}은(는) 0 이상의 정수로 적어 주세요.`);
  return n;
}

    async onSubmit(f){
      const pk = readPk();
      const otherOn = $('#rw-other-on').checked;
      const strict = $('#rw-strict').checked, lvStrict = !!pk.level && $('#rw-lvstrict').checked;
      const rw = { gold:intField(f.gold, '보수'),
                   less: strict ? 0 : intField(f.less, '개체값 부족 금액'), strict,
                   more: intField(f.more, '개체값 초과 금액'),
                   lvLess: pk.level && !lvStrict ? intField(f.lvless, '레벨 부족 금액') : 0, lvStrict,
                   other: otherOn ? (f.other || '').trim() : '' };
      if (otherOn && !rw.other) throw new Error('다른 보수 내용을 적어 주세요.');
      const row = { board:'request', title:pkTitle(pk), body:(f.body || '').trim(), meta:{ pk, reward:rw } };
      const closes = a.admin ? readDeadline(f) : null;
      if (closes) row.closes_at = closes;
      const post = await S.api.createPost(row);
      S.api.notify('post', post.id);
      toast(a.admin ? '의뢰를 올렸어요.' : '의뢰를 올렸어요. 7일 뒤 자동으로 마감돼요.');
      renderView();
    },
  });
}

/* =====================================================================
   동작
   ===================================================================== */
const ACTIONS = {
  async login(){ await S.api.login(); if (S.api.demo) { location.hash = '#home'; refresh(); } },
  async logout(){ await S.api.logout(); history.replaceState(null, '', location.pathname + location.search); refresh(); },
  'close-modal'(){ closeModal(); },
  'demo-role'(d){ S.api.setRole(d.role); refresh(); },
  'demo-start'(){ S.api = makeDemoApi(); refresh(); },
  'exit-demo'(){ location.href = location.pathname; },
  'rocket-tab'(d){ S.rocketTab = d.tab; renderView(); },

  async write(d){
    const B = BOARDS[d.board];
    if (d.board === 'request') return writeRequest();
    const extra = B.fields.map(f => `<div class="field"><label>${esc(f.label)}</label>
      <input class="input" name="m_${f.k}" placeholder="${esc(f.ph)}" ${f.type === 'number' ? 'type="number" min="1" inputmode="numeric"' : 'maxlength="60"'}></div>`).join('');
    openForm({
      title: d.board === 'notice' ? '공지 쓰기' : `${B.name} 글쓰기`,
      sub: d.board === 'notice' ? '' : '올리면 디스코드 알림 채널에도 소식이 올라가요.',
      html: `<div class="field"><label>제목</label><input class="input" name="title" maxlength="80" required></div>
        ${extra}
        ${B.deadline ? deadlineField() : ''}
        <div class="field"><label>내용</label><textarea class="input" name="body" maxlength="2000" placeholder="자세한 내용 (선택)"></textarea></div>`,
      submit: '올리기',
      async onSubmit(f){
        const meta = {};
        B.fields.forEach(x => { const v = (f[`m_${x.k}`] || '').trim(); if (v) meta[x.k] = v; });
        const row = { board:d.board, title:f.title.trim(), body:(f.body || '').trim(), meta };
        const closes = readDeadline(f);
        if (closes) row.closes_at = closes;
        const post = await S.api.createPost(row);
        S.api.notify('post', post.id);
        toast('글을 올렸어요.');
        renderView();
      },
    });
  },
  join(d){
    const id = Number(d.id);
    const card = document.querySelector(`[data-act="join"][data-id="${id}"]`)?.closest('.card');
    const board = location.hash.slice(1); const B = BOARDS[board];
    openForm({
      title: B.join,
      sub: `<b>${esc(card?.querySelector('h3')?.textContent || '')}</b> 글쓴이에게 디스코드 DM으로 알려드려요.`,
      html: `<div class="field"><label>전할 말</label><textarea class="input" name="message" maxlength="300" placeholder="${esc(B.msgPh)}"></textarea></div>`,
      submit: B.join,
      async onSubmit(f){
        const e = await S.api.createEntry(id, (f.message || '').trim());
        const n = await S.api.notify('entry', e.id);
        toast(n.ok && n.dm?.author !== false ? '신청했어요. 글쓴이에게 알림을 보냈어요.' : '신청은 됐지만 디스코드 알림은 보내지 못했어요.', n.ok && n.dm?.author !== false ? '' : 'warn');
        renderView();
      },
    });
  },
  async leave(d){
    if (!await ask('신청 취소', '이 신청을 취소할까요?', '취소하기', true)) return;
    await S.api.deleteEntry(Number(d.id)); toast('신청을 취소했어요.'); renderView();
  },
  'post-deadline'(d){
    openForm({
      title: '신청 마감 시각',
      sub: '정한 시각이 지나면 자동으로 신청이 닫혀요. 비워 두면 지금부터 일주일 뒤 자동으로 마감돼요.',
      html: deadlineField(),
      submit: '저장',
      async onSubmit(f){
        await S.api.updatePost(Number(d.id), { closes_at:readDeadline(f), status:'open' });
        toast('마감 시각을 저장했어요.'); renderView();
      },
    });
  },
  async 'post-status'(d){
    await S.api.setPostStatus(Number(d.id), d.status);
    toast(d.status === 'closed' ? '마감했어요.' : '다시 열었어요.'); renderView();
  },
  async 'del-post'(d){
    if (!await ask('글 삭제', '이 글과 신청 내역이 모두 삭제돼요. 되돌릴 수 없어요.', '삭제', true)) return;
    await S.api.deletePost(Number(d.id)); toast('삭제했어요.'); renderView();
  },

  async 'new-listing'(d){
    try { await loadDex(); } catch (e) { return toast(e.message, 'err'); }
    const have = d.kind === 'have';
    openForm({
      title: have ? '보유 포켓몬 올리기' : '필요한 포켓몬 올리기',
      sub: have ? '줄 수 있는 포켓몬의 정확한 정보를 적어 주세요. 단원들이 "받을게요"로 예약할 수 있어요.'
                : '원하는 조건을 골라 주세요. 상관없는 항목은 "상관없음"으로 두면 돼요. 단원들이 "줄게요"로 예약할 수 있어요.',
      wide: true,
      html: pkEditorHtml(!have, !have) + `<div class="field"><label>추가 정보 (선택)</label><textarea class="input" name="details" maxlength="500" placeholder="예: 주로 저녁 8~11시 접속 · Lv.50 · 기술 구성 등"></textarea></div>`,
      submit: '올리기',
      onOpen(){ bindPkEditor(!have); },
      async onSubmit(f){
        const pk = readPk();
        await S.api.createListing({ kind:d.kind, pokemon:pkTitle(pk), details:(f.details || '').trim(), meta:{ pk } });
        toast('올렸어요.'); renderView();
      },
    });
  },
  'pk-pick'(d){ pickPk(d.id); },
  'pk-change'(){ $('#pk-picked').hidden = true; $('#pk-search').hidden = false; const q = $('#pk-q'); q.value = ''; q.focus(); },
  'iv-all'(d){
    STATS.forEach(x => {
      const any = d.v === 'any';
      const c = $(`#mform [data-ivany="${x.k}"]`);
      if (c) { c.checked = any; c.closest('.iv-row').classList.toggle('any', any); }
      if (!any) { $(`#mform [data-iv="${x.k}"]`).value = d.v; $(`#mform [data-ivn="${x.k}"]`).value = d.v; }
    });
    drawPkHex();
  },
  reserve(d){
    const card = document.querySelector(`[data-act="reserve"][data-id="${d.id}"]`).closest('.card');
    const have = card.dataset.kind === 'have';
    openForm({
      title: have ? '받을게요' : '줄게요',
      sub: '확인을 누르면 두 분의 디스코드 DM으로 예약이 전송돼요.',
      html: `<div class="summary"><b>${esc(card.dataset.pokemon)}</b> · ${have ? `${esc(card.dataset.owner)}님이 주고, 내가 받아요` : `내가 주고, ${esc(card.dataset.owner)}님이 받아요`}</div>
        <div class="field"><label>전할 말</label><textarea class="input" name="message" maxlength="300" required placeholder="예: 저녁 8시에 접속 가능합니다"></textarea></div>`,
      submit: '확인',
      async onSubmit(f){
        const r = await S.api.createReservation(Number(d.id), f.message.trim());
        const n = await S.api.notify('reservation', r.id);
        if (!n.ok) toast(`예약은 저장됐지만 디스코드 알림을 보내지 못했어요. (${n.error || '알 수 없는 오류'})`, 'warn');
        else if (n.dm && (!n.dm.owner || !n.dm.requester)) {
          const miss = [!n.dm.owner && card.dataset.owner, !n.dm.requester && '나'].filter(Boolean).join(', ');
          toast(`예약됐어요. 다만 ${miss}에게는 DM을 못 보냈어요. (디스코드 서버 미가입 또는 DM 차단)`, 'warn');
        } else toast('예약됐어요! 두 분의 디스코드로 알림을 보냈어요.');
        renderView();
      },
    });
  },
  async 'listing-status'(d){
    await S.api.setListingStatus(Number(d.id), d.status);
    toast(d.status === 'done' ? '거래 완료로 표시했어요.' : '다시 열었어요.'); renderView();
  },
  async 'del-listing'(d){
    if (!await ask('삭제', '이 글과 예약이 모두 삭제돼요.', '삭제', true)) return;
    await S.api.deleteListing(Number(d.id)); toast('삭제했어요.'); renderView();
  },
  async 'res-status'(d){
    if (d.status === 'cancelled' && !await ask('예약 취소', '이 예약을 취소할까요?', '예약 취소', true)) return;
    await S.api.setReservationStatus(Number(d.id), d.status);
    toast(d.status === 'done' ? '완료했어요.' : '취소했어요.'); renderView();
  },

  async verify(d){
    try { await S.api.updateProfile(d.id, { mc_verified: d.v === '1' }); toast(d.v === '1' ? '인증했어요.' : '인증을 해제했어요.'); }
    catch (e) { toast(e.message, 'err'); }
    renderView();
  },
  async 'bot-test'(d, el){
    el.disabled = true;
    const n = await S.api.notify('bot-test');
    el.disabled = false;
    if (!n.ok) return toast(`실패: ${n.error}`, 'err');
    if (n.demo) return toast('데모 모드라 실제로 보내지 않았어요.', 'warn');
    toast(`봇 연결: ${n.gateway} · 내 DM: ${n.dm ? '성공' : '실패'} · 알림 채널: ${n.channel ? '성공' : '실패/미설정'}`, n.dm ? '' : 'warn');
  },
  async 'ms-link'(d, el){
    el.disabled = true;
    try { await S.api.msStart(); if (S.api.demo) await refresh(); }
    catch (e) { toast(e.message, 'err'); el.disabled = false; }
  },
};

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  try { await fn(el.dataset, el); } catch (err) { toast(err.message || String(err), 'err'); }
});
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset?.act !== 'role') return;
  try { await S.api.updateProfile(el.dataset.id, { role: el.value }); toast(`권한을 ${ROLE_NAME[el.value]}(으)로 바꿨어요.`); }
  catch (err) { toast(err.message, 'err'); }
  renderView();
});
let searchTimer;
document.addEventListener('input', (e) => {
  if (e.target.dataset?.act !== 'member-search') return;
  S.memberQuery = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const pos = e.target.selectionStart;
    await renderView();
    const box = document.querySelector('[data-act="member-search"]');
    if (box) { box.focus(); box.setSelectionRange(pos, pos); }
  }, 250);
});
document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'mcform') return;
  e.preventDefault();
  const name = new FormData(e.target).get('mc_name').trim();
  if (!/^[A-Za-z0-9_]{1,16}$/.test(name)) return toast('닉네임은 영문, 숫자, _ 만 쓸 수 있어요 (최대 16자).', 'err');
  if (name === S.me.mc_name) return toast('이미 저장된 닉네임이에요.', 'warn');
  try {
    await S.api.setMcName(S.me.id, name);
    S.api.notify('verify-request');
    toast('저장했어요. 관리자가 확인하면 인증돼요.');
    await refresh();
  } catch (err) { toast(err.message, 'err'); }
});
window.addEventListener('hashchange', () => { renderShell(); renderView(); });

/* ---------- 시작 ---------- */
(async function boot(){
  if (DEMO) S.api = makeDemoApi();
  else if (typeof supabase === 'undefined') {
    S.api = makeDemoApi();
    toast('로그인 서버(Supabase)를 불러오지 못해 데모로 열었어요. 새로고침해 보세요.', 'err');
  } else S.api = makeSupaApi();
  const q = new URLSearchParams(location.search);
  if (q.get('mc') === 'ok') toast(`마인크래프트 닉네임 ${q.get('name') || ''} 인증 완료!`);
  else if (q.get('mc') === 'err') toast(MC_ERRORS[q.get('reason')] || 'Microsoft 연동에 실패했어요.', 'err');
  if (q.has('mc')) history.replaceState(null, '', location.pathname + location.hash);
  S.api.onAuth(() => refresh());
  await refresh();
})();
</script>
